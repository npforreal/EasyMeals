name: EasyMeals
options:
  bundleIdPrefix: com.easymeals
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
targets:
  EasyMeals:
    type: application
    platform: iOS
    sources:
      - path: EasyMeals
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: EasyMeals
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easymeals.app
        GENERATE_INFOPLIST_FILE: YES
  EasyMealsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EasyMealsUITests
    dependencies:
      - target: EasyMeals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easymeals.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EasyMeals:
    build:
      targets:
        EasyMeals: all
    test:
      targets:
        - EasyMealsUITests
