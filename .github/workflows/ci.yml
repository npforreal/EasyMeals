name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx fastapi supabase jinja2 pydantic-settings python-dotenv uvicorn[standard]

      - name: Install Node dependencies & Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run scripts/check.sh (ruff + format + pytest + node test + playwright)
        run: bash scripts/check.sh
